<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="The Theology Shelf">
  <rect width="64" height="64" rx="12" fill="#20303f"/>
  <rect x="4" y="4" width="56" height="56" rx="9" fill="none" stroke="#c79a52" stroke-width="1.6"/>
  <g fill="#c79a52">
    <!-- upright books (left) -->
    <rect x="13" y="24" width="5" height="22" rx="0.6"/>
    <rect x="19" y="16" width="5" height="30" rx="0.6"/>
    <rect x="25" y="21" width="5" height="25" rx="0.6"/>
    <rect x="31" y="19" width="5" height="27" rx="0.6"/>
    <!-- stacked books lying flat (right), left-aligned; middle a touch shorter -->
    <rect x="37" y="41" width="11" height="5" rx="1"/>
    <rect x="37" y="35" width="9.5" height="5" rx="1"/>
    <rect x="37" y="29" width="11" height="5" rx="1"/>
    <!-- shelf -->
    <rect x="11" y="47" width="40" height="3" rx="1.5"/>
  </g>
  <g stroke="#20303f" stroke-width="1.3" stroke-linecap="round">
    <!-- spine details on the upright books -->
    <line x1="19.8" y1="22" x2="23.2" y2="22"/>
    <line x1="19.8" y1="25" x2="23.2" y2="25"/>
    <line x1="31.8" y1="24" x2="35.2" y2="24"/>
  </g>
</svg>
